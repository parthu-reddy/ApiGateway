spring:
  application:
    name: api-gateway
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  # The gateway's routes, RBAC rules and API docs come only from ConfigService
  # (Deployment/api-gateway.yml). fail-fast makes startup fail when ConfigService cannot be read,
  # whatever the optional: prefix says (ConfigServerConfigDataLoader throws when fail-fast is set
  # or the import is not optional), so there is no packaged fallback to drift from it.
  cloud:
    config:
      fail-fast: true
