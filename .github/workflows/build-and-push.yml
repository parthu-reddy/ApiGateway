name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Microservice
        uses: actions/checkout@v5
        with:
          path: ApiGateway

      - name: Checkout Parent POM
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/FoodDeliveryParentPOM
          path: deps/FoodDeliveryParentPOM
          token: ${{ secrets.CHECKOUT_TOKEN }}
          
      - name: Checkout IdentitySigning
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/IdentitySigning
          path: deps/IdentitySigning
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout CommonLibrary
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/FoodDeliveryCommonLibrary
          path: deps/FoodDeliveryCommonLibrary
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install Shared Libraries
        run: |
          mvn -q -B -N install -f deps/FoodDeliveryParentPOM/pom.xml
          mvn -q -B install -f deps/IdentitySigning/pom.xml
          
          # Create dummy directory for typescript-generator-maven-plugin in CommonLibrary
          mkdir -p deps/FoodDeliveryAppUI/src/types
          mvn -q -B install -f deps/FoodDeliveryCommonLibrary/pom.xml

      - name: Build Microservice
        run: mvn -B clean package -DskipTests -f ApiGateway/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: hyd.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ApiGateway/Dockerfile
          push: true
          tags: hyd.ocir.io/axekmbadoczl/food-delivery/api-gateway:${{ github.sha }}

      - name: Checkout Deployment Repo
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/Deployment
          path: deps/Deployment
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Clean up old Docker images
        run: python3 deps/Deployment/retention.py --apply --service api-gateway

      - name: Update .versions file
        working-directory: deps/Deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            git pull --rebase origin main || git pull origin main
            git checkout -- .versions
            
            TAG_VAR=$(echo "api-gateway" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_TAG
            if grep -q "^${TAG_VAR}=" .versions; then
              sed -i "s/^${TAG_VAR}=.*/${TAG_VAR}=${{ github.sha }}/g" .versions
            else
              echo "${TAG_VAR}=${{ github.sha }}" >> .versions
            fi
            
            git commit -am "Update ${TAG_VAR} with new image tag" || {
              echo "No changes to commit"
              exit 0
            }
            
            if git push origin HEAD:main; then
              echo "Successfully updated .versions!"
              exit 0
            fi
            
            echo "Push rejected due to race condition. Retrying ($i/$MAX_RETRIES)..."
            sleep $((1 + RANDOM % 5))
          done
          
          echo "Failed to push .versions after $MAX_RETRIES attempts"
          exit 1

      - name: Trigger Contract Verification
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}
          repository: parthu-reddy/FoodDeliveryContracts
          event-type: module-pushed
