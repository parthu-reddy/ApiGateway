rbac:
  rules:
    authenticated:
    - /api/v1/users
    - /api/v1/internal/auth/sessions
    - /api/v1/internal/auth/logout
    - /api/v1/verification
    customer:
    - /api/v1/customers
    # Singular: CustomerOrderController serves /api/v1/customer/orders/**, which the plural prefix
    # above does not match -- rbac matches on `equals` or `startsWith(prefix + "/")`. The customer
    # refund-request call was routed and served but refused here. Found 2026-09-09.
    - /api/v1/customer
    - /api/v1/orders
    - /api/v1/places
    - /api/places
    - /api/maps
    - /api/config
    - /api/v1/ledger
    - /api/v1/chat
    - /ws/chat
    - /api/v1/tracking
    - /api/v1/logistics/route
    - /api/v1/money/customer
    # The customer writes reviews and reads restaurant/product ones.
    - /api/v1/reviews
    restaurant:
    - /api/v1/restaurants
    - /api/v1/brands
    - /api/v1/outlets
    - /api/v1/categories
    - /api/v1/logistics
    - /api/v1/images
    - /api/places
    - /api/maps
    - /api/config
    - /api/v1/ledger
    - /api/v1/chat
    - /ws/chat
    - /api/v1/campaigns
    - /api/v1/advertisers
    - /api/v1/money/restaurant
    - /api/v1/money/advertiser
    - /api/v1/ledger/statements
    - /api/v1/ledger/payouts
    # Read-only in practice: an owner sees their outlet's reviews. Writing is refused by
    # ReviewController's hasRole('CUSTOMER').
    - /api/v1/reviews
    delivery:
    - /api/v1/images
    - /api/v1/logistics
    - /api/v1/delivery
    - /api/delivery
    - /api/logistics
    - /api/fleet
    - /api/places
    - /api/maps
    - /api/config
    - /api/v1/ledger
    - /api/v1/chat
    - /ws/chat
    - /api/v1/money/driver
    - /api/v1/ledger/statements
    - /api/v1/ledger/payouts
    # A driver reads their own rating. ReviewAccessPolicy restricts EntityType.DRIVER to the driver
    # themself, so reaching the route is not the same as reading someone else's.
    - /api/v1/reviews
