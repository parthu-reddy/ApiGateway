name: Build and Push Docker Image

on:
  # push:
    # branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Microservice
        uses: actions/checkout@v5
        with:
          path: ApiGateway

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build Microservice
        env:
          # Classic token. The shared libraries come from GitHub Packages now
          # instead of being rebuilt from source in this job.
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: mvn -B clean package -Pci-tests -s ApiGateway/.github/maven-settings.xml -f ApiGateway/pom.xml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: hyd.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      # Dead step: the body below was commented out, which left a step with a name and
      # neither `run` nor `uses`. GitHub rejects the entire workflow for that, so every
      # service build has been unrunnable (422 at dispatch) rather than merely skipping
      # this. Commented out with its body until the dispatch is wanted again.
      # - name: Trigger Contract Verification
#        uses: peter-evans/repository-dispatch@v3
#        with:
#          token: ${{ secrets.CHECKOUT_TOKEN }}
#          repository: parthu-reddy/FoodDeliveryContracts
#          event-type: module-pushed
      - name: Checkout Deployment Repo
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/Deployment
          path: deps/Deployment
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Clean up old Docker images
        run: python3 deps/Deployment/retention.py --apply --delete-all --service api-gateway

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ApiGateway/Dockerfile
          push: true
          tags: hyd.ocir.io/axekmbadoczl/food-delivery/api-gateway:${{ github.sha }}
          platforms: linux/arm64

      - name: Update deployment env file
        working-directory: deps/Deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            # Always start fresh from the remote
            git pull --rebase origin main

            TAG_VAR=$(echo "api-gateway" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_TAG
            mkdir -p env_deployments/dev
            echo "${TAG_VAR}=${{ github.sha }}" > env_deployments/dev/api-gateway.env
            git add env_deployments/dev/api-gateway.env

            # Check if there are changes to commit
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "Update ${TAG_VAR} with new image tag"
            
            if git push origin HEAD:main; then
              echo "Successfully updated deployment env file!"
              break
            fi
            
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi
            
            echo "Push rejected due to race condition. Retrying ($i/$MAX_RETRIES)..."
            git reset --hard HEAD~1
            git pull --rebase origin main
            sleep $((1 + RANDOM % 5))
          done

