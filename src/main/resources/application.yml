spring:
  application:
    name: api-gateway
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
    gateway:
      # Rate limiting is declared per route below, NOT here. Spring Cloud Gateway ADDS every
      # default-filter to a route's chain instead of letting the route override it, so a route
      # asking for a higher rate still got the stricter default and the two buckets both
      # charged. That capped the Ola tile proxy at 40 burst and silently defeated every route that
      # asked for more than the default -- event-tracking-service (100/200) and bidding-engine
      # (50/100) were both getting 40. Verified against /actuator/gateway/routes on 2026-09-10.
      # Any new route MUST carry its own RequestRateLimiter; validate_core_services.py check
      # GW-RATELIMIT enforces that.
      routes:
      - id: admin-customer-routes
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/internal/admin/orders/**,/api/v1/internal/admin/customers/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
            key-resolver: '#{@ipKeyResolver}'
      - id: admin-refund-routes
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/internal/admin/refunds/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
            key-resolver: '#{@ipKeyResolver}'
      - id: admin-delivery-routes
        uri: lb://delivery-service
        predicates:
        - Path=/api/v1/internal/admin/delivery/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
            key-resolver: '#{@ipKeyResolver}'
      - id: admin-restaurant-routes
        uri: lb://restaurant-service
        predicates:
        - Path=/api/v1/internal/admin/restaurants/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
            key-resolver: '#{@ipKeyResolver}'
      - id: admin-identity-routes
        uri: lb://identity-service
        predicates:
        - Path=/api/v1/internal/admin/users/**,/api/v1/internal/users/**,/api/v1/internal/auth/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: '#{@ipKeyResolver}'
        - name: CircuitBreaker
          args:
            name: identityServiceCircuitBreaker
      - id: admin-ledger-routes
        uri: lb://ledger-service
        predicates:
        - Path=/api/v1/internal/admin/payouts/**,/api/v1/internal/admin/cash/**,/api/v1/internal/admin/ledger/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
            key-resolver: '#{@ipKeyResolver}'

      - id: reviews-service
        uri: lb://reviews-service
        predicates:
        # The admin prefix rides this route too. Mounting it under /api/v1/internal/admin/ is what
        # keeps GlobalJwtAuthFilter's internal-path block from rejecting it -- that filter carves
        # out exactly that prefix and nothing else under /api/v1/internal/.
        - Path=/api/v1/reviews/**,/api/v1/reviews,/api/v1/internal/admin/reviews/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: '#{@ipKeyResolver}'
      - id: money-customer
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/money/customer/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: money-restaurant
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/money/restaurant/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: money-driver
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/money/driver/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: money-advertiser
        uri: lb://wallet-service
        predicates:
        - Path=/api/v1/money/advertiser/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: ledger-statements
        uri: lb://ledger-service
        predicates:
        - Path=/api/v1/ledger/statements/**,/api/v1/ledger/payouts/**,/api/v1/ledger/cash/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: campaign-service
        uri: lb://campaign-service
        predicates:
        - Path=/api/v1/advertisers/**,/api/v1/campaigns/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: '#{@ipKeyResolver}'
      - id: bidding-engine
        uri: lb://bidding-engine
        predicates:
        - Path=/api/v1/ads/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            key-resolver: '#{@ipKeyResolver}'
      - id: event-tracking-service
        uri: lb://event-tracking-service
        predicates:
        - Path=/api/v1/tracking/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            key-resolver: '#{@ipKeyResolver}'
      - id: ola-maps-proxy
        uri: https://api.olamaps.io
        predicates:
        - Path=/olamaps/**
        filters:
        # Map tiles, not API calls. A cold MapLibre load of a 1440x820 map measured 33 requests with
        # 31 of them inside one second (style, 3 TileJSONs, sprite, 3 glyph ranges, and 12 vector tiles
        # per source), and panning immediately asks for more. Against the old shared 40-token bucket a
        # single map consumed ~78% of it in one second, leaving almost nothing for the page's own API
        # calls -- and MapLibre never retries a tile the gateway rejects, so a 429 leaves a permanently
        # blank square. Ola serves tiles with max-age=3600, so a warm browser costs nothing and this
        # bucket only has to absorb the cold load. Measured 2026-09-10.
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 400
            key-resolver: '#{@ipKeyResolver}'
        - RewritePath=/olamaps/(?<segment>.*),/${segment}
        - AddRequestParameter=api_key, ${OLA_MAPS_API_KEY:dummy_key}
      - id: maps-integration-api
        uri: lb://mapsintegration
        predicates:
        - Path=/api/v1/places/**,/api/v1/logistics/**,/api/v1/fleet/**
        filters:
        - RewritePath=/api/v1/(.*),/api/$1
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      # ---------------------------------------------------------------- public webhooks
      # Razorpay, Cashfree and Vyapar POST here when a payment settles. GlobalJwtAuthFilter already
      # treats /api/v1/webhooks/ as public and WebhookController verifies each provider's signature,
      # but there was no route: every callback 404'd at the gateway, so no payment was ever
      # confirmed from the gateway's side. Found 2026-09-09 auditing routes against service specs.
      - id: payment-webhooks
        uri: lb://payment-service
        predicates:
        - Path=/api/v1/webhooks/**

      # ---------------------------------------------------------------- customer surface
      # MUST precede restaurant-catalog. CustomerApplication is the customer-facing facade for
      # these three: it calls restaurant-service over Feign and enriches the result (sponsored
      # listings on /nearby, distances on /brands/**). Routing them to restaurant-service would
      # return the raw upstream and silently drop both.
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: customer-restaurant-facade
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/restaurants/nearby,/api/v1/restaurants/brands/**,/api/v1/restaurants/*/delivery-availability
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'

      - id: customer-orders
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/orders/**,/api/v1/customer/orders/**,/api/v1/customers/**

      # ---------------------------------------------------------------- restaurant surface
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: restaurant-catalog
        uri: lb://restaurant-service
        predicates:
        - Path=/api/v1/restaurants/**,/api/v1/brands/**,/api/v1/categories/**,/api/v1/outlets/**,/api/v1/images/**

      # ---------------------------------------------------------------- rider surface
      # Both prefixes: DeliveryExecutiveApplication serves /api/v1/delivery/** and, natively,
      # /api/delivery/** (profile, onboarding, verification, and the /api/delivery/tracking
      # websocket). No RewritePath -- the service serves these paths as written.
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: delivery-app
        uri: lb://delivery-service
        predicates:
        - Path=/api/v1/delivery/**,/api/delivery/**

      # ---------------------------------------------------------------- shared surfaces
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: chat-service-routes
        uri: lb://chat-service
        predicates:
        - Path=/api/v1/chat/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'

      - id: identity-users
        uri: lb://identity-service
        predicates:
        - Path=/api/v1/users/**

      # The payee-facing ledger reads that sit outside statements/payouts/cash. Guarded per-owner
      # by MoneyAccessPolicy in LedgerController.
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: ledger-payee-reads
        uri: lb://ledger-service
        predicates:
        - Path=/api/v1/ledger/accounts/**,/api/v1/ledger/orders/**

      # MapsIntegration serves /api/places/** as written, and that is what the generated client
      # calls. The /api/v1/places/** route below rewrites into the same handlers; this one carries
      # the shape actually in use.
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: maps-places
        uri: lb://mapsintegration
        predicates:
        - Path=/api/places/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'

      - id: service-docs-customer
        uri: lb://customer-service
        predicates:
        - Path=/service-docs/customer-service/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
        - RewritePath=/service-docs/customer-service/(.*),/$1
      - id: service-docs-restaurant
        uri: lb://restaurant-service
        predicates:
        - Path=/service-docs/restaurant-service/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
        - RewritePath=/service-docs/restaurant-service/(.*),/$1
      - id: service-docs-delivery
